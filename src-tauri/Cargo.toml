[package]
name = "openviewer"
version = "0.1.0"
description = "A Typora-style Markdown editor for macOS with the Newsprint look"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
encoding_rs = "0.8"
chardetng = "0.1"
getrandom = "0.3"

# macOS-only: WebKit/AppKit printing for PDF export, and race-safe file I/O (F_GETPATH, openat,
# copyfile). Windows support would add its own section; see src/platform/.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKWebpagePreferences", "WKNavigation", "objc2-app-kit"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSError", "NSGeometry", "NSString", "NSURL", "NSValue"] }
objc2-app-kit = { version = "0.3", features = ["NSPrintOperation", "NSPrintInfo", "NSView", "NSResponder", "NSGraphics", "NSWindow"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
